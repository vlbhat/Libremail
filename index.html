<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; style-src 'self'; img-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';">
  <title>LibreMail — Decentralized Webmail</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="logo">✉️ LibreMail</div>
    <div class="search-bar">
      <input type="search" id="search-input" placeholder="Search encrypted mail..." aria-label="Search mail">
    </div>
    <button class="account-pill" id="copy-address-btn" type="button" title="Copy your public key">
      <span class="dot" aria-hidden="true"></span>
      <span id="my-address-short">Loading...</span> 📋
    </button>
  </header>

  <div class="workspace">
    <aside aria-label="Main navigation">
      <button class="compose-btn" id="compose-btn" type="button">✏️ Compose</button>
      <button class="nav-item active" id="nav-inbox" data-folder="inbox" type="button"><span>📥 Inbox</span><span id="count-inbox">0</span></button>
      <button class="nav-item" id="nav-starred" data-folder="starred" type="button"><span>⭐ Starred</span></button>
      <button class="nav-item" id="nav-sent" data-folder="sent" type="button"><span>📤 Sent</span></button>
      <button class="nav-item" id="nav-trash" data-folder="trash" type="button"><span>🗑️ Trash</span></button>
      <button class="nav-item" id="nav-contacts" data-folder="contacts" type="button"><span>👥 Contacts</span></button>

      <div class="relay-box">
        <label for="custom-relay"><strong>Relay Server:</strong></label>
        <input type="url" id="custom-relay" value="wss://relay.primal.net" autocomplete="url">
        <button id="save-relay-btn" type="button">Connect Relay</button>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <span id="folder-title">Inbox</span>
        <span id="status-text" role="status" aria-live="polite">Initializing...</span>
      </div>
      <div class="mail-list" id="mail-list" aria-label="Messages"></div>
      <div class="reader" id="mail-reader"></div>
      <div class="contacts-view" id="contacts-view">
        <h2>Saved Contacts</h2>
        <div class="contacts-form">
          <input type="text" id="contact-name" placeholder="Nickname (e.g. Bob)" aria-label="Contact nickname">
          <input type="text" id="contact-address" placeholder="Public key or user@domain.com" aria-label="Contact address">
          <button class="send-btn" id="add-contact-btn" type="button">Add Contact</button>
        </div>
        <div id="contacts-list"></div>
      </div>
    </main>
  </div>

  <section class="compose-modal" id="compose-modal" role="dialog" aria-modal="true" aria-labelledby="compose-title">
    <div class="compose-header">
      <span id="compose-title">New Message</span>
      <button class="close-btn" id="close-compose-btn" type="button" aria-label="Close compose">✕</button>
    </div>
    <label class="visually-hidden" for="to-input">Recipient</label>
    <input type="text" id="to-input" list="contact-suggestions" placeholder="To (public key, NIP-05 address, or contact)">
    <datalist id="contact-suggestions"></datalist>
    <label class="visually-hidden" for="sub-input">Subject</label>
    <input type="text" id="sub-input" placeholder="Subject" maxlength="200">
    <label class="visually-hidden" for="body-input">Message body</label>
    <textarea id="body-input" rows="8" maxlength="20000" placeholder="Write your end-to-end encrypted message..."></textarea>
    <input type="hidden" id="reply-id-input">
    <div class="compose-footer">
      <button class="send-btn" id="send-btn" type="button">Send</button>
      <span class="crypto-tag">🔒 NIP-17 + NIP-05</span>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
