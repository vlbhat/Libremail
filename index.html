<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>LibreMail — Decentralized Webmail</title>
  <link rel="stylesheet" href="css/styles.css?v=2">
  <link rel="stylesheet" href="css/controls.css?v=2">
</head>
<body>
  <header>
    <div class="logo">✉️ LibreMail</div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search encrypted mail..." aria-label="Search messages">
    </div>
    <div class="account-pill" id="copy-address-btn" title="Copy your public key">
      <span class="dot" aria-hidden="true"></span>
      <span id="my-address-short">Loading...</span> 📋
    </div>
  </header>

  <div class="workspace">
    <aside aria-label="Mail navigation">
      <button class="compose-btn" id="compose-btn" type="button">✏️ Compose</button>
      <div class="nav-item active" id="nav-inbox" data-folder="inbox"><span>📥 Inbox</span><span id="count-inbox">0</span></div>
      <div class="nav-item" id="nav-starred" data-folder="starred"><span>⭐ Starred</span></div>
      <div class="nav-item" id="nav-sent" data-folder="sent"><span>📤 Sent</span></div>
      <div class="nav-item" id="nav-trash" data-folder="trash"><span>🗑️ Trash</span></div>
      <div class="nav-item" id="nav-contacts" data-folder="contacts"><span>👥 Contacts</span></div>

      <div class="relay-box">
        <label for="custom-relay"><strong>Relay server</strong></label>
        <input type="text" id="custom-relay" value="wss://relay.primal.net" autocomplete="url">
        <button id="save-relay-btn" type="button">Connect to relay</button>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <span id="folder-title">Inbox</span>
        <span id="status-text" role="status" aria-live="polite">Connecting to decentralized relay...</span>
      </div>
      <div class="mail-list" id="mail-list"></div>
      <div class="reader" id="mail-reader"></div>

      <div class="contacts-view" id="contacts-view">
        <h2>Saved Contacts</h2>
        <div class="contacts-form">
          <input type="text" id="contact-name" placeholder="Nickname (e.g. Bob)" aria-label="Contact nickname">
          <input type="text" id="contact-address" placeholder="Public key or user@domain.com" aria-label="Contact public key or NIP-05 address">
          <button class="send-btn" id="add-contact-btn" type="button">Add contact</button>
        </div>
        <div id="contacts-list"></div>
      </div>
    </main>
  </div>

  <div class="compose-modal" id="compose-modal" role="dialog" aria-modal="true" aria-labelledby="compose-title">
    <div class="compose-header">
      <span id="compose-title">New Message</span>
      <button class="close-btn" id="close-compose-btn" type="button" aria-label="Close compose window" title="Close">✕</button>
    </div>
    <input type="text" id="to-input" list="contact-suggestions" placeholder="To (public key, NIP-05 address, or contact)" aria-label="Recipient">
    <datalist id="contact-suggestions"></datalist>
    <input type="text" id="sub-input" placeholder="Subject" aria-label="Subject">
    <textarea id="body-input" rows="8" placeholder="Write your end-to-end encrypted email..." aria-label="Message body"></textarea>
    <input type="hidden" id="reply-id-input">
    <div class="compose-footer">
      <button class="send-btn" id="send-btn" type="button">Send message</button>
      <span class="crypto-tag">🔒 Encrypted message</span>
    </div>
  </div>

  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
